name: Go - Dev Binary Publish

on:
  workflow_call:
    inputs:
      go_version_file:
        description: File that defines the Go version (go.mod or .go-version).
        required: false
        type: string
        default: go.mod
      main_package:
        description: Go package (path) of the main binary.
        required: false
        type: string
        default: ./cmd
      version_package:
        description: Go package that holds the Version, GitCommit and BuildDate variables.
        required: false
        type: string
        default: github.com/ghdrope/go-version
      platforms:
        description: Space separated list of GOOS/GOARCH targets.
        required: false
        type: string
        default: linux/amd64 linux/arm64

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_NAME: ${{ github.event.repository.name }}

jobs:
  build-dev-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dev-binary
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Compile binaries
        env:
          MAIN_PACKAGE: ${{ inputs.main_package }}
          VERSION_PACKAGE: ${{ inputs.version_package }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Fail early if the version package is not part of the build,
          # otherwise -X is silently ignored and binaries report no version.
          go list "$VERSION_PACKAGE" > /dev/null

          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X '${VERSION_PACKAGE}.Version=development' \
            -X '${VERSION_PACKAGE}.GitCommit=${GITHUB_SHA}' \
            -X '${VERSION_PACKAGE}.BuildDate=${BUILD_DATE}'"

          mkdir -p dist
          for platform in $PLATFORMS; do
            os="${platform%/*}"
            arch="${platform#*/}"
            echo "🔨 Building ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="$LDFLAGS" \
              -o "dist/${PROJECT_NAME}-dev-${os}-${arch}" "$MAIN_PACKAGE"
          done

          (cd dist && sha256sum -- * > sha256sums.txt)

      - name: Upload dev binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-dev-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7
