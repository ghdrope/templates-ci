name: Docker - Docker Dev

on:
  workflow_call:
    inputs:
      component:
        description: Component name; the image becomes <repo>-<component>. Empty for single component projects.
        required: false
        type: string
        default: ''
      dockerfile:
        description: Path to the Dockerfile.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Comma separated list of target platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  image_build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-dev-${{ inputs.component }}
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare image name
        id: prep
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          # Registry image names must be lowercase.
          NAME="${GITHUB_REPOSITORY,,}${COMPONENT:+-$COMPONENT}"
          {
            echo "name=$NAME"
            echo "image=${REGISTRY}/${NAME}"
            echo "cache_scope=${COMPONENT:-default}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-
          labels: |
            org.opencontainers.image.title=${{ steps.prep.outputs.name }}
            org.opencontainers.image.description=An image with ${{ steps.prep.outputs.name }} binary installed
            org.opencontainers.image.version=development
            org.opencontainers.image.vendor=Pedro Cozinheiro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          # One cache scope per component, otherwise components overwrite each other's cache.
          cache-from: type=gha,scope=${{ steps.prep.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.cache_scope }}
          build-args: |
            COMPONENT=${{ inputs.component }}
            VERSION=development
            BUILD_DATE=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_COMMIT=${{ github.sha }}
