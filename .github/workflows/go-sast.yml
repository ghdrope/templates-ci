name: Go - SAST

on:
  workflow_call:
    inputs:
      multi_component:
        description: Build with `make build-all` instead of `make build`.
        required: false
        type: boolean
        default: false
      go_version_file:
        description: File that defines the Go version (go.mod or .go-version).
        required: false
        type: string
        default: go.mod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build
        env:
          MULTI_COMPONENT: ${{ inputs.multi_component }}
        run: |
          if [[ "$MULTI_COMPONENT" == "true" ]]; then
            make build-all
          else
            make build
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  dependency-check:
    name: GoVulnCheck Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: go.sum

      # jq (used by the Makefile to parse the report) is preinstalled on ubuntu runners.
      - name: Run govulncheck via Makefile
        run: make check-vulnerability

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: .reports/pipelines/security/govulncheck-report.json
          if-no-files-found: warn
