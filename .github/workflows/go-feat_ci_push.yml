name: Go - Feat CI Push

on:
  workflow_call:
    inputs:
      go_version_file:
        description: File that defines the Go version (go.mod or .go-version).
        required: false
        type: string
        default: go.mod
      reports_dir:
        description: Directory where `make test-unit` writes the coverage reports.
        required: false
        type: string
        default: .reports/pipelines/SDLC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_NAME: ${{ github.event.repository.name }}
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=github-tags depName=boumenot/gocover-cobertura
  GOCOVER_COBERTURA_VERSION: v1.5.0

jobs:
  lint-format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Check go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # golangci-lint already runs `go vet` (the `govet` linter is part of the default set).
      - name: Run linter
        run: make lint

      - name: Check formatting
        run: make format-check

  build-and-unit-tests:
    needs: lint-format-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install gocover-cobertura
        run: |
          go install "github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage threshold
        run: make test-unit

      - name: Write coverage summary
        if: always()
        env:
          COVERAGE_FILE: ${{ inputs.reports_dir }}/${{ env.PROJECT_NAME }}-coverage.out
        run: |
          if [[ -f "$COVERAGE_FILE" ]]; then
            {
              echo "### Coverage"
              echo
              echo '```'
              go tool cover -func="$COVERAGE_FILE" | tail -n 1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Coverage file not found: $COVERAGE_FILE"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ inputs.reports_dir }}/${{ env.PROJECT_NAME }}-coverage.out
            ${{ inputs.reports_dir }}/${{ env.PROJECT_NAME }}-coverage.xml
          if-no-files-found: warn
