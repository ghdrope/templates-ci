name: Docker - Docker Publish

on:
  workflow_call:
    inputs:
      components:
        description: JSON list of components, e.g. '["api", "worker"]'. Empty list for single component projects.
        required: false
        type: string
        default: '[]'
      dockerfile:
        description: Path to the Dockerfile.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Comma separated list of target platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      attestations:
        description: Attach SBOM and provenance attestations to the image.
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: ${{ (inputs.components != '' && inputs.components != '[]') && fromJSON(inputs.components) || fromJSON('[""]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare tags and metadata
        id: prep
        env:
          COMPONENT: ${{ matrix.component }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Registry image names must be lowercase.
          NAME="${GITHUB_REPOSITORY,,}${COMPONENT:+-$COMPONENT}"
          IMAGE="${REGISTRY}/${NAME}"
          CLEAN_TAG="${GITHUB_REF_NAME#v}"

          if [[ ! "$CLEAN_TAG" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-rc[0-9]+|-patch[0-9]+)?$ ]]; then
            echo "::error::'${GITHUB_REF_NAME}' is not a release version (X.Y.Z, X.Y.Z-rcN or X.Y.Z-patchN)."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MM="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          TAGS="${IMAGE}:${CLEAN_TAG}"
          echo "🔖 Tag base: $CLEAN_TAG"

          if [[ "$CLEAN_TAG" =~ -rc[0-9]+$ ]]; then
            echo "⚡ RC build detected, no floating tags"
          else
            echo "✅ Release / patch build detected"

            # Floating tags (latest, MAJOR, MAJOR.MINOR) only move forward:
            # a backport release (e.g. 1.4.3 after 1.5.0) must not take them over.
            STABLE="$(
              {
                gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" --jq '.[].ref' \
                  | sed 's#^refs/tags/##; s#^v##'
                echo "$CLEAN_TAG"
              } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-patch[0-9]+)?$' | sort -uV
            )"

            highest() { grep -E "^${1//./\\.}" <<< "$STABLE" | tail -n 1; }

            if [[ "$(highest '')" == "$CLEAN_TAG" ]]; then
              TAGS="$TAGS,${IMAGE}:latest"
              echo "➕ Adding latest tag"
            fi
            if [[ "$(highest "${MAJOR}.")" == "$CLEAN_TAG" ]]; then
              TAGS="$TAGS,${IMAGE}:${MAJOR}"
              echo "➕ Adding major tag: $MAJOR"
            fi
            if [[ "$(highest "${MM}.")" == "$CLEAN_TAG" ]]; then
              TAGS="$TAGS,${IMAGE}:${MM}"
              echo "➕ Adding major.minor tag: $MM"
            fi
          fi

          {
            echo "tags=$TAGS"
            echo "name=$NAME"
            echo "image=$IMAGE"
            echo "version=$CLEAN_TAG"
            echo "cache_scope=${COMPONENT:-default}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          labels: |
            org.opencontainers.image.title=${{ steps.prep.outputs.name }}
            org.opencontainers.image.description=An image with ${{ steps.prep.outputs.name }} binary installed
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.vendor=Pedro Cozinheiro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}
          # One cache scope per component, otherwise components overwrite each other's cache.
          cache-from: type=gha,scope=${{ steps.prep.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.cache_scope }}
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ steps.prep.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_COMMIT=${{ github.sha }}
